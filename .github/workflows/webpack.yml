```yaml
name: Deploy React Frontend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Production Environment File
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Error: VITE_API_URL secret is not configured."
            exit 1
          fi
          printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.production

      - name: Build React Application
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html was not generated."
            exit 1
          fi

      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/"
          target: "/var/www/goopiy.online"
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m
```

