name: Deploy React POS SHOPZA to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Production Environment File
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -n "$VITE_API_URL" ]; then
            printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.production
          else
            echo "VITE_API_URL is not configured yet."
            echo "Building SHOPZA without a backend API URL."
          fi

      - name: Build React Application
        run: npm run build

      - name: Verify Build
        run: test -f dist/index.html

      - name: Deploy POS SHOPZA
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/"
          target: "/var/www/pos.mytestindevlab.online"
          strip_Components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m
